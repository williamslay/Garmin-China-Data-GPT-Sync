name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plugin and test dependencies
        working-directory: .agents/plugins/garmin-cn-sync
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        working-directory: .agents/plugins/garmin-cn-sync
        run: python -m pytest
