[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-cn-sync"
version = "0.1.0"
description = "Local-first, read-only Garmin China MCP sync server"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "curl-cffi>=0.13,<1",
  "fitparse>=1.2,<2",
  "garminconnect==0.3.13",
  "keyring==25.7.0",
  "mcp>=1.28,<2",
  "PySocks==1.7.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "PyYAML>=6.0.2,<7"]

[project.scripts]
garmin-cn-sync = "garmin_cn_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
